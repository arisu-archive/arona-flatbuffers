[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "arona-flatbuffers"
version = "0.10.0"
description = "Generated FlatBuffers schemas and bindings for Arona game data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "flatbuffers>=25.2.10",
    "xxhash>=3.0.0",
]

[project.urls]
Repository = "https://github.com/arisu-archive/arona-flatbuffers"
Issues = "https://github.com/arisu-archive/arona-flatbuffers/issues"

[tool.uv.build-backend]
module-root = "python"
module-name = ["FlatData", "MX"]
